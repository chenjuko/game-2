<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健腦大作戰 - 過目不忘記憶遊戲</title>
  <style>
    :root {
      --bg-color: #f4f9f9;
      --card-bg: #ffffff;
      --primary-color: #2a75d3;
      --btn-color: #ff9800;
      --text-color: #333333;
    }

    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.8rem;
      color: var(--primary-color);
      margin: 10px 0;
    }

    .instruction {
      font-size: 1.8rem;
      font-weight: bold;
      color: #d32f2f;
      min-height: 2.2rem;
    }

    /* 遊戲區域 */
    .game-board {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
      perspective: 1000px;
      min-height: 220px;
    }

    /* 卡片與翻牌動畫 */
    .card {
      width: 160px;
      height: 200px;
      background-color: var(--card-bg);
      border: 4px solid var(--primary-color);
      border-radius: 16px;
      font-size: 5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
      user-select: none;
    }

    .card.flipped {
      transform: rotateY(180deg);
      background-color: #bbdefb;
    }

    .card-content {
      backface-visibility: hidden;
    }

    /* 控制按鈕區 */
    .controls {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .btn {
      font-size: 1.8rem;
      font-weight: bold;
      padding: 15px 40px;
      background-color: var(--btn-color);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* 彈出過關訊息 */
    .result-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 5px solid #4caf50;
      padding: 30px 50px;
      border-radius: 20px;
      text-align: center;
      font-size: 2.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧠 阿公阿嬤健腦遊戲：過目不忘</h1>
    <div class="instruction" id="instruction">按「開始遊戲」準備挑戰！</div>
  </header>

  <main>
    <div class="game-board" id="board">
      <!-- 卡片由 JavaScript 動態生成 -->
    </div>

    <div class="controls">
      <button class="btn" onclick="startGame()">▶ 開始遊戲</button>
      <button class="btn" style="background-color: #757575;" onclick="resetGame()">🔄 重置</button>
    </div>
  </main>

  <div class="result-modal" id="resultModal">
    🎉 答對了！太厲害了！ 👍
  </div>

  <script>
    const items = ['🍎', '🍌', '🍊', '🍇', '🍉'];
    let currentCards = [];
    let missingItem = '';
    let isGameActive = false;

    function startGame() {
      const board = document.getElementById('board');
      const instruction = document.getElementById('instruction');
      document.getElementById('resultModal').style.display = 'none';
      board.innerHTML = '';
      
      // 隨機選取 3 個水果
      const shuffled = [...items].sort(() => 0.5 - Math.random());
      currentCards = shuffled.slice(0, 3);
      
      // 渲染卡片
      currentCards.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<span class="card-content">${item}</span>`;
        board.appendChild(card);
      });

      instruction.innerText = "請記住這三樣水果！( 5秒時間 )";
      
      // 5秒後翻牌並移除一個水果
      setTimeout(() => {
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => card.classList.add('flipped'));

        // 隨機移除一個
        const removeIndex = Math.floor(Math.random() * 3);
        missingItem = currentCards[removeIndex];

        setTimeout(() => {
          instruction.innerText = "請問哪一個水果不見了？點擊卡片猜猜看！";
          
          // 重新展示翻轉後的結果，供長輩點擊互動
          cards.forEach((card, index) => {
            if(index !== removeIndex) {
              card.classList.remove('flipped');
            } else {
              card.querySelector('.card-content').innerText = '❓';
              card.classList.remove('flipped');
            }
            
            // 點擊事件
            card.onclick = () => {
              if (index === removeIndex) {
                document.getElementById('resultModal').style.display = 'block';
                instruction.innerText = `答對了！消失的是 ${missingItem}！`;
              } else {
                instruction.innerText = "再想一下下喔～這張還在！";
              }
            };
          });
        }, 1000);

      }, 5000);
    }

  function resetGame() {
    document.getElementById('board').innerHTML = '';
    document.getElementById('instruction').innerText = '按「開始遊戲」準備挑戰！';
    document.getElementById('resultModal').style.display = 'none';
  }
  </script>

</body>
</html>
